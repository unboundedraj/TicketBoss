openapi: 3.0.0
info:
  title: TicketBoss API
  version: 1.0.0

paths:
  /reservations:
    post:
      summary: Reserve seats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                partnerId:
                  type: string
                seats:
                  type: integer
      responses:
        "201":
          description: Reservation confirmed
        "400":
          description: Invalid seats
        "409":
          description: Not enough seats

    get:
      summary: List reservations
      responses:
        "200":
          description: OK

  /reservations/{id}:
    delete:
      summary: Cancel reservation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Cancelled
        "404":
          description: Not found

  /event:
    get:
      summary: Event summary
      responses:
        "200":
          description: OK
